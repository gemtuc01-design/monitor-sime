name: Monitor SIME
on:
  schedule:
    # Corre a los minutos 0 de las horas 11, 14, 17, 20 y 23 (UTC)
    # Que equivalen a 08, 11, 14, 17 y 20 hs (Argentina)
    # Lunes a Viernes (1-5)
    - cron: '0 11,14,17,20,23 * * 1-5'
  workflow_dispatch: # Permite correrlo manual si quieres

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar todo
        run: pip install selenium requests webdriver-manager
      - name: Correr Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_github.py
      - name: Guardar cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vistos.txt
          git commit -m "Actualizar vistos" || exit 0
          git push
