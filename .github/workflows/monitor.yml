name: Monitor Docente Tucuman

on:
  schedule:
    # ── Horario inteligente ────────────────────────────────────────────────
    # Mañana (ART = UTC-3): cada 15 min de 07:00 a 13:00
    - cron: '0,15,30,45 10,11,12,13,14,15 * * 1-5'  # Lun-Vie 07:00-12:45 ART
    # Resto del día: cada 30 min de 13:00 a 23:30
    - cron: '0,30 16,17,18,19,20,21,22,23 * * 1-5'  # Lun-Vie 13:00-20:30 ART
    # Fines de semana: cada hora (por si acaso)
    - cron: '0 10,14,18 * * 6,0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bots:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install selenium requests webdriver-manager

      # ── Bot SIME ────────────────────────────────────────────────────────────
      - name: Ejecutar SIME
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_github.py

      # ── Bot Cursos (capacitación docente nivel Primario) ────────────────────
      - name: Ejecutar Cursos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cursos_github.py

      # ── Resumen Semanal (lunes 08:00 ART = 11:00 UTC) ──────────────────────
      - name: Resumen Semanal SIME
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HORA=$(date +%H)
          DIA=$(date +%u)
          if [[ "$DIA" == "1" && "$HORA" == "11" ]]; then
            echo "✅ Ejecutando resumen semanal..."
            python resumen_semanal.py
          else
            echo "⏭️  No es lunes 08hs. Saltando resumen semanal..."
          fi
        shell: bash

      # ── Guardar memorias ────────────────────────────────────────────────────
      - name: Guardar cambios en memorias
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sime_vistos.txt sime_historial.json sime_estado.json cursos_vistos.txt || true
          git commit -m "Actualizar memorias [skip ci]" || exit 0
          git push
