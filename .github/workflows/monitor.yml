name: Monitor SIME
on:
  schedule:
    - cron: '*/20 * * * *'  # Cada 20 min
  workflow_dispatch:        # Para poder probarlo a mano

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # IMPORTANTE: Permiso para que el bot escriba en vistos.txt
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar todo
        run: pip install selenium requests webdriver-manager
      - name: Correr Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_github.py
      - name: Guardar cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vistos.txt
          git commit -m "Actualizar vistos" || exit 0
          git push
