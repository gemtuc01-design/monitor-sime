name: Monitor Docente Tucuman

on:
  schedule:
    - cron: '*/30 * * * *'   # Monitoreo continuo cada 30 min
  workflow_dispatch:           # Ejecución manual desde GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bots:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install selenium requests webdriver-manager

      # ── Bot SIME (vacantes Maestro de Grado — alerta inmediata) ──────────
      # Días hábiles, en las horas configuradas
      - name: Ejecutar SIME
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HORA=$(date +%H)
          DIA=$(date +%u)
          if [[ "$DIA" -le 5 && ("$HORA" == "11" || "$HORA" == "14" || "$HORA" == "17" || "$HORA" == "20" || "$HORA" == "23") ]]; then
            echo "✅ Ejecutando bot SIME..."
            python bot_github.py
          else
            echo "⏭️  Fuera de horario para SIME. Saltando..."
          fi
        shell: bash

      # ── Bot Cursos (capacitación docente nivel Primario) ──────────────────
      # Corre en todas las ejecuciones
      - name: Ejecutar Cursos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "✅ Ejecutando bot Cursos..."
          python cursos_github.py

      # ── Resumen Semanal SIME (lunes 08:00 hora Argentina) ────────────────
      # UTC-3 = Argentina. Lunes 08:00 ART → 11:00 UTC → HORA=11, DIA=1
      - name: Resumen Semanal SIME
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HORA=$(date +%H)
          DIA=$(date +%u)
          if [[ "$DIA" == "1" && "$HORA" == "11" ]]; then
            echo "✅ Ejecutando resumen semanal..."
            python resumen_semanal.py
          else
            echo "⏭️  No es lunes a las 08hs. Saltando resumen semanal..."
          fi
        shell: bash

      # ── Guardar memorias en el repositorio ───────────────────────────────
      - name: Guardar cambios en memorias
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sime_vistos.txt cursos_vistos.txt || true
          git commit -m "Actualizar memorias [skip ci]" || exit 0
          git push
