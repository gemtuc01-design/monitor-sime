name: Monitor Docente Tucuman

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bots:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install selenium requests webdriver-manager

      # ── Bot SIME (vacantes Maestro de Grado) ──────────────────────────────
      # Se ejecuta solo en días hábiles (lun-vie) en las horas configuradas
      - name: Ejecutar SIME
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HORA=$(date +%H)
          DIA=$(date +%u)
          if [[ "$DIA" -le 5 && ("$HORA" == "11" || "$HORA" == "14" || "$HORA" == "17" || "$HORA" == "20" || "$HORA" == "23") ]]; then
            echo "✅ Ejecutando bot SIME..."
            python bot_github.py
          else
            echo "⏭️  Fuera de horario para SIME. Saltando..."
          fi
        shell: bash

      # ── Bot Cursos (capacitación docente nivel Primario) ──────────────────
      # Se ejecuta en TODAS las corridas (cada 30 min, todos los días)
      - name: Ejecutar Cursos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "✅ Ejecutando bot Cursos..."
          python cursos_github.py

      # ── Guardar memorias en el repositorio ───────────────────────────────
      - name: Guardar cambios en memorias
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sime_vistos.txt cursos_vistos.txt || true
          git commit -m "Actualizar memorias [skip ci]" || exit 0
          git push
